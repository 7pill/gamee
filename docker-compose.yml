services:
  app:
    build: .
    image: gamee:latest
    ports:
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped
    # Also in the Dockerfile; repeated here because some builders drop HEALTHCHECK from the image.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
